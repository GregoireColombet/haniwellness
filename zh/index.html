<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>即將推出 — Haniwellness | 曹哈妮 Tsao Hani 台北個人教練與色彩穿搭</title>
        <meta
            name="description"
            content="Haniwellness 由 Tsao Hani 主理，台北頂級私人健身教練、空中瑜珈、個人色彩穿搭顧問。全新蛻變，即將盛大呈獻。"
        />
        <meta name="robots" content="noindex, follow" />
        <link rel="stylesheet" href="../css/style.css" />
        <link rel="icon" href="../images/hani_logo_orange.png" type="image/png" />
        <script>
            // Check for direct preview bypass parameter
            const params = new URLSearchParams(window.location.search);
            if (params.get('preview') === 'hani' || sessionStorage.getItem('hw_preview') === '1') {
                sessionStorage.setItem('hw_preview', '1');
                window.location.replace('home.html?preview=hani');
            }
        </script>
    </head>
    <body class="hw-shield-active">
        <main id="hw-maintenance-shield" role="main" aria-label="Coming Soon Announcement">
            <div class="hw-shield-container">
                <div class="hw-shield-topbar">
                    <button type="button" class="hw-lang-toggle" id="hw-lang-toggle-btn" aria-label="切換語言">English</button>
                </div>

                <div class="hw-shield-brand" id="hw-brand-logo" role="button" tabindex="0" title="Haniwellness">
                    Hani<em>wellness</em>
                </div>

                <div class="hw-shield-tag" id="hw-tag">台北 · 全新蛻變 敬請期待</div>

                <h1 class="hw-shield-title" id="hw-title">
                    身心靈的優雅昇華<br /><em>即將盛大呈獻</em>
                </h1>
                <p class="hw-shield-desc" id="hw-desc">
                    我們正在悉心籌備由 Tsao Hani 主理的頂級私人健身、空中瑜珈與個人色彩穿搭顧問體驗，帶給您由內而外的專屬自信。
                </p>

                <div class="hw-shield-card">
                    <h2 class="hw-card-title" id="hw-card-title">私人課程與色彩諮詢 正常預約中</h2>
                    <p class="hw-card-subtitle" id="hw-card-sub">信義旗艦教室 · 到府尊爵私教</p>

                    <div class="hw-qr-wrap">
                        <img
                            src="../images/line-qr-code-haniwellness.png"
                            alt="加入 Haniwellness 官方 LINE 預約"
                            width="130"
                            height="130"
                            class="hw-qr-img"
                        />
                    </div>

                    <p class="hw-line-note" id="hw-line-note">
                        歡迎掃描下方 QR Code 或透過社群直接與 Hani 聯繫預約：
                    </p>
                </div>

                <div class="hw-shield-footer" id="hw-footer">
                    &copy; 2026 Haniwellness &middot; 曹哈妮 Tsao Hani. 版權所有
                </div>
            </div>
        </main>

        <script>
            (function () {
                const strings = {
                    en: {
                        tag: 'EST. TAIPEI · COMING SOON',
                        title: 'Something Transformative<br><em>is Coming Soon</em>',
                        desc: 'We are curating an elevated sanctuary dedicated to private personal training, aerial yoga, and professional color styling by Tsao Hani in Taipei.',
                        cardTitle: 'Private Consultations & Bookings Open',
                        cardSub: 'Xinyi Studio · Private Gym Sessions',
                        lineNote: 'Scan or connect with Tsao Hani directly on LINE for bookings and consultations:',
                        btnLang: '切換至中文',
                        footer: '&copy; 2026 Haniwellness &middot; Tsao Hani. All rights reserved.'
                    },
                    zh: {
                        tag: '台北 · 全新蛻變 敬請期待',
                        title: '身心靈的優雅昇華<br><em>即將盛大呈獻</em>',
                        desc: '我們正在悉心籌備由 Tsao Hani 主理的頂級私人健身、空中瑜珈與個人色彩穿搭顧問體驗，帶給您由內而外的專屬自信。',
                        cardTitle: '私人課程與色彩諮詢 正常預約中',
                        cardSub: '信義旗艦教室 · 到府尊爵私教',
                        lineNote: '歡迎掃描下方 QR Code 或透過社群直接與 Hani 聯繫預約：',
                        btnLang: 'English',
                        footer: '&copy; 2026 Haniwellness &middot; 曹哈妮 Tsao Hani. 版權所有'
                    }
                };

                let lang = 'zh';
                const toggleBtn = document.getElementById('hw-lang-toggle-btn');
                toggleBtn.addEventListener('click', function () {
                    lang = lang === 'zh' ? 'en' : 'zh';
                    const s = strings[lang];
                    document.getElementById('hw-tag').textContent = s.tag;
                    document.getElementById('hw-title').innerHTML = s.title;
                    document.getElementById('hw-desc').textContent = s.desc;
                    document.getElementById('hw-card-title').textContent = s.cardTitle;
                    document.getElementById('hw-card-sub').textContent = s.cardSub;
                    document.getElementById('hw-line-note').textContent = s.lineNote;
                    document.getElementById('hw-footer').innerHTML = s.footer;
                    toggleBtn.textContent = s.btnLang;
                    document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
                });

                // Secret 3x click on logo to open preview
                let clicks = 0;
                let timer = null;
                const logo = document.getElementById('hw-brand-logo');
                if (logo) {
                    logo.addEventListener('click', function () {
                        clicks++;
                        clearTimeout(timer);
                        timer = setTimeout(function () { clicks = 0; }, 600);
                        if (clicks >= 3) {
                            clicks = 0;
                            const pass = prompt('Enter preview passphrase:');
                            if (pass && pass.trim().toLowerCase() === 'hani') {
                                sessionStorage.setItem('hw_preview', '1');
                                window.location.href = 'home.html?preview=hani';
                            } else if (pass !== null) {
                                alert('Incorrect passphrase');
                            }
                        }
                    });
                }
            })();
        </script>
    </body>
</html>
